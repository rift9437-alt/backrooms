<script>
const $=id=>document.getElementById(id);
const DEF={G:{n:'Security Badge',i:'🪪',d:'Hold right mouse / Q. Forces shapeshifters to reveal and stuns them.'},W:{n:'Almond Water',i:'💧',d:'Fully restores stamina.'},B:{n:'Battery',i:'🔋',d:'Recharges your flashlight.'},F:{n:'Flashlight',i:'🔦',d:'Press F to toggle. Drains battery.'},L:{n:'Flare',i:'🔥',d:'Throw it. The entity goes to investigate.'}};
const H=3.4;let CELL=4,N=31,grid,myId,ready=false,ws;
const keys={},items=new Map(),others=new Map(),inv=Array(6).fill(null);
let sel=0,stamina=100,battery=100,flashOn=false,yaw=0,pitch=0,fear=0,bobT=0,mt=0,lastSend=0,flick=0;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,60);
camera.rotation.order='YXZ';scene.add(camera);scene.background=new THREE.Color(0x14110a);scene.fog=new THREE.FogExp2(0x14110a,.075);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
const amb=new THREE.AmbientLight(0xfff0b0,.4);scene.add(amb);
const lamp=new THREE.PointLight(0xffe9a0,.8,13);camera.add(lamp);
const spot=new THREE.SpotLight(0xfff4d0,0,24,.5,.6);spot.position.set(0,0,0);spot.target.position.set(0,0,-1);camera.add(spot,spot.target);
camera.position.set(4,1.65,4);

function tex(fn,rep){const c=document.createElement('canvas');c.width=c.height=256;fn(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep,rep);return t}
const noise=(x,n,a)=>{for(let i=0;i<n;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*a})`;x.fillRect(Math.random()*256,Math.random()*256,2,2)}};
const wallT=tex(x=>{x.fillStyle='#c4b050';x.fillRect(0,0,256,256);for(let i=0;i<256;i+=32){x.fillStyle='rgba(120,100,20,.35)';x.fillRect(i,0,10,256);x.fillStyle='rgba(255,240,150,.15)';x.fillRect(i+14,0,3,256)}noise(x,3000,.25)});
const carpT=tex(x=>{x.fillStyle='#7b6c30';x.fillRect(0,0,256,256);noise(x,9000,.5)},0);
const ceilT=tex(x=>{x.fillStyle='#cfc8a0';x.fillRect(0,0,256,256);x.strokeStyle='#7a7450';x.lineWidth=4;x.strokeRect(0,0,256,256);noise(x,1500,.2)},0);

function blocked(x,z){const cx=Math.round(x/CELL),cy=Math.round(z/CELL);return !grid[cy]||grid[cy][cx]!==0}
function canAt(x,z){const r=.4;return!(blocked(x+r,z+r)||blocked(x-r,z+r)||blocked(x+r,z-r)||blocked(x-r,z-r))}

let panels,panelMat;
function build(){
  const walls=[],lights=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(grid[y][x])walls.push([x,y]);else if((x+y)%3===0)lights.push([x,y])}
  const wm=new THREE.InstancedMesh(new THREE.BoxGeometry(CELL,H,CELL),new THREE.MeshStandardMaterial({map:wallT,roughness:.95}),walls.length);
  const m4=new THREE.Matrix4();walls.forEach(([x,y],i)=>{m4.setPosition(x*CELL,H/2,y*CELL);wm.setMatrixAt(i,m4)});scene.add(wm);
  const S=N*CELL,mid=(N-1)/2*CELL;carpT.repeat.set(N*2,N*2);ceilT.repeat.set(N*2,N*2);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(S,S).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({map:carpT,roughness:1}));fl.position.set(mid,0,mid);scene.add(fl);
  const ce=new THREE.Mesh(new THREE.PlaneGeometry(S,S).rotateX(Math.PI/2),new THREE.MeshStandardMaterial({map:ceilT,roughness:1}));ce.position.set(mid,H,mid);scene.add(ce);
  panelMat=new THREE.MeshBasicMaterial({color:0xfffbe0});
  panels=new THREE.InstancedMesh(new THREE.PlaneGeometry(1.8,.8).rotateX(Math.PI/2),panelMat,lights.length);
  lights.forEach(([x,y],i)=>{m4.setPosition(x*CELL,H-.02,y*CELL);panels.setMatrixAt(i,m4)});scene.add(panels);
  mon=makeMonster();scene.add(mon.root);mon.root.visible=false;
}

// ---------- realistic models ----------
function skinTex(base,vein){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,256,256);
  for(let i=0;i<2500;i++){x.fillStyle=`rgba(${Math.random()<.5?'60,40,40':'210,200,190'},${Math.random()*.12})`;x.beginPath();x.arc(Math.random()*256,Math.random()*256,Math.random()*6+1,0,7);x.fill()}
  if(vein){x.strokeStyle=vein;for(let i=0;i<40;i++){x.beginPath();let a=Math.random()*256,b=Math.random()*256;x.moveTo(a,b);for(let k=0;k<8;k++){a+=Math.random()*30-15;b+=Math.random()*30-15;x.lineTo(a,b)}x.stroke()}}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const lathe=(pts,seg)=>new THREE.LatheGeometry(pts.map(([r,y])=>new THREE.Vector2(Math.max(r,.002),y)),seg||18);
const limbGeo=(len,r0,r1,bulge,seg)=>{const p=[];for(let i=0;i<=12;i++){const t=i/12;p.push([r0+(r1-r0)*t+Math.sin(t*Math.PI)*bulge,-len*t])}return lathe(p,seg||14)};
const blob=(mat,rx,ry,rz,x,y,z,par)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),mat);m.scale.set(rx,ry,rz);m.position.set(x,y,z);par.add(m);return m};
const grp=(par,x,y,z)=>{const g=new THREE.Group();g.position.set(x,y,z);par.add(g);return g};
const part=(geo,mat,par,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);par.add(m);return m};
const DS=THREE.DoubleSide;

function makeHuman(id){
  const hue=(id*.37)%1,tones=[0xf1c9a5,0xd9a47b,0xa8744f,0x6f4a33,0xe8b998],hairs=[0x2b1b10,0x111111,0x7a5230,0xb8903c,0x3a3a3a];
  const M=(c,r,s)=>new THREE.MeshStandardMaterial({color:c,roughness:r,side:s||THREE.FrontSide});
  const skin=M(tones[id%5],.55),jacket=M(new THREE.Color().setHSL(hue,.45,.32),.85,DS),pants=M(0x232a38,.9,DS),shoe=M(0x101010,.5),hair=M(hairs[(id*3)%5],.8),white=M(0xf4f4f4,.3),iris=M(0x2a1a10,.3),lip=M(0x8a4a4a,.6);
  const g=new THREE.Group(),m=grp(g,0,0,0);m.rotation.y=Math.PI;
  const torso=part(lathe([[.15,.92],[.14,1.05],[.16,1.2],[.19,1.4],[.2,1.5],[.17,1.57],[.06,1.62]],24),jacket,m);torso.scale.z=.62;
  blob(pants,.17,.11,.11,0,.95,0,m);part(lathe([[.055,1.55],[.05,1.68]],12),skin,m);
  const head=grp(m,0,1.74,0);
  blob(skin,.095,.12,.105,0,0,0,head);blob(skin,.07,.06,.08,0,-.07,.02,head);blob(skin,.015,.022,.025,0,-.01,.108,head);blob(lip,.024,.006,.01,0,-.05,.1,head);
  for(const s of[-1,1]){blob(white,.017,.011,.008,s*.04,.02,.095,head);blob(iris,.008,.008,.006,s*.04,.02,.102,head);blob(skin,.012,.025,.016,s*.098,0,0,head)}
  const hh=part(new THREE.SphereGeometry(1,24,16,0,Math.PI*2,0,Math.PI*.55),hair,head,0,.012,-.008);hh.scale.set(.1,.125,.112);
  const arms=[],legs=[];
  for(const s of[-1,1]){
    const sh=grp(m,s*.22,1.52,0);blob(jacket,.06,.06,.06,0,0,0,sh);part(limbGeo(.3,.055,.045,.008),jacket,sh);
    const el=grp(sh,0,-.3,0);blob(jacket,.047,.047,.047,0,0,0,el);part(limbGeo(.27,.045,.035,.006),jacket,el);blob(skin,.035,.05,.02,0,-.31,0,el);arms.push([sh,el]);
    const hip=grp(m,s*.09,.95,0);part(limbGeo(.45,.085,.06,.012),pants,hip);
    const kn=grp(hip,0,-.45,0);blob(pants,.06,.06,.06,0,0,0,kn);part(limbGeo(.45,.06,.04,.01),pants,kn);blob(shoe,.045,.035,.11,0,-.47,.04,kn);legs.push([hip,kn]);
  }
  const beam=new THREE.Mesh(new THREE.ConeGeometry(.7,3.5,12,1,true),new THREE.MeshBasicMaterial({color:0xfff4b0,transparent:true,opacity:.12,side:DS}));
  beam.rotation.x=-Math.PI/2;beam.position.set(0,1.5,-1.9);beam.visible=false;g.add(beam);
  return{g,arms,legs,beam,mt:0,tx:0,tz:0,ry:0}
}
function stepHuman(h,dt,tx,tz,ry){
  const p=h.g.position,dx=tx-p.x,dz=tz-p.z,k=Math.min(1,dt*10);p.x+=dx*k;p.z+=dz*k;
  const sp=Math.hypot(dx,dz)*k/Math.max(dt,.001);let d=ry-h.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));h.g.rotation.y+=d*Math.min(1,dt*12);
  h.mt+=dt*Math.min(sp,7)*1.7;const a=Math.min(.75,sp*.16);
  h.legs.forEach(([hp,kn],i)=>{const q=h.mt+i*Math.PI;hp.rotation.x=Math.sin(q)*a;kn.rotation.x=Math.max(0,Math.sin(q+1.6))*a*1.3});
  h.arms.forEach(([sh,el],i)=>{const q=h.mt+i*Math.PI;sh.rotation.x=-Math.sin(q)*a*.8;el.rotation.x=-.2-Math.max(0,Math.sin(q))*a*.5});
}

let mon;
function makeMonster(o){o=o||{};
  const tex=skinTex(o.skin||'#b3aca0','rgba(110,40,50,.5)');
  const skin=new THREE.MeshStandardMaterial({map:tex,bumpMap:tex,bumpScale:.9,roughness:.8,color:o.tone||0xffffff,side:DS});
  const dark=new THREE.MeshStandardMaterial({color:0x080505,roughness:.6}),tooth=new THREE.MeshStandardMaterial({color:0xd8d0b0,roughness:.4}),claw=new THREE.MeshStandardMaterial({color:0x1a1410,roughness:.3}),eyeM=new THREE.MeshBasicMaterial({color:o.eye||0xff2200});
  const root=new THREE.Group(),body=grp(root,0,0,0);root.scale.setScalar(o.scale||1);
  const tp=[];for(let i=0;i<=40;i++){const t=i/40;let r=.13+Math.sin(t*Math.PI)*.1+(t>.4?.03:0);if(t>.15&&t<.85)r+=Math.cos(t*60)*.008;if(t>.9)r*=1-(t-.9)*6;tp.push([r,1.2+t*1.5])}
  part(lathe(tp,28),skin,body).scale.z=.62;
  blob(skin,.2,.12,.12,0,1.25,0,body);
  for(let i=0;i<9;i++)blob(skin,.025,.02,.025,0,1.35+i*.15,-.1,body);
  part(lathe([[.06,2.6],[.04,2.8],[.05,2.98]],12),skin,body);
  const head=grp(body,0,3.1,0),hg=new THREE.SphereGeometry(1,32,24),pa=hg.attributes.position;
  for(let i=0;i<pa.count;i++){const x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i),n=1+.05*Math.sin(x*9+y*7)*Math.cos(z*8);pa.setXYZ(i,x*n,y*n,z*n)}hg.computeVertexNormals();
  part(hg,skin,head).scale.set(.15,.27,.16);
  for(const s of[-1,1]){blob(dark,.045,.055,.035,s*.06,.08,.13,head);blob(eyeM,.016,.016,.016,s*.06,.08,.155,head);blob(dark,.03,.07,.03,s*.1,-.02,.09,head);blob(dark,.008,.02,.01,s*.012,-.01,.158,head)}
  blob(dark,.085,.06,.07,0,-.1,.1,head);
  const jaw=grp(head,0,-.08,.02);blob(skin,.09,.06,.11,0,-.06,.07,jaw);
  for(let i=0;i<9;i++){const a=(i/8-.5)*2.4,tx=Math.sin(a)*.08,tz=Math.cos(a)*.09;
    const u=part(new THREE.ConeGeometry(.007,.045,5),tooth,head,tx,-.075,tz);u.rotation.x=Math.PI;
    part(new THREE.ConeGeometry(.007,.045,5),tooth,jaw,tx,-.02,tz+.0)}
  const arms=[],legs=[],fingers=[];
  for(const s of[-1,1]){
    const sh=grp(body,s*.28,2.6,0);blob(skin,.07,.07,.07,0,0,0,sh);part(limbGeo(1.15,.075,.05,.012),skin,sh);
    const el=grp(sh,0,-1.15,0);blob(skin,.05,.05,.05,0,0,0,el);part(limbGeo(1.25,.05,.03,.01),skin,el);
    const hand=grp(el,0,-1.25,0);blob(skin,.045,.06,.02,0,-.05,0,hand);
    for(let k=0;k<4;k++){let par=grp(hand,(k-1.5)*.022,-.1,0);const js=[];
      for(let n=0;n<3;n++){const L=[.17,.15,.13][n];part(limbGeo(L,.011-n*.002,.008-n*.002,0,6),skin,par);js.push(par);if(n<2)par=grp(par,0,-L,0);else part(new THREE.ConeGeometry(.006,.05,5),claw,par,0,-L-.02,0).rotation.x=Math.PI}
      fingers.push(js)}
    arms.push([sh,el,s]);
    const hip=grp(root,s*.13,1.28,0);part(limbGeo(.7,.1,.06,.02),skin,hip);
    const kn=grp(hip,0,-.7,0);blob(skin,.06,.06,.06,0,0,0,kn);part(limbGeo(.7,.06,.035,.01),skin,kn);blob(skin,.05,.035,.15,0,-.72,.07,kn);
    for(let k=-1;k<=1;k++)part(new THREE.ConeGeometry(.012,.07,5),claw,kn,k*.025,-.72,.2).rotation.x=Math.PI/2;
    legs.push([hip,kn]);
  }
  const l=new THREE.PointLight(o.eye||0xff3300,.5,8);l.position.y=2.8;root.add(l);
  return{root,head,jaw,body,arms,legs,fingers,tx:0,tz:0,h:0,chase:0,init:false,mt:0};
}
function animCreature(m,dt){
  if(!m.init)return;
  const px=m.root.position.x,pz=m.root.position.z,k=Math.min(1,dt*8);
  m.root.position.x+=(m.tx-px)*k;m.root.position.z+=(m.tz-pz)*k;
  const moving=Math.hypot(m.tx-px,m.tz-pz)>.05;
  let d=m.h-m.root.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));m.root.rotation.y+=d*Math.min(1,dt*6);
  m.mt+=dt*(m.chase?10:4.5)*(moving?1:.2);const mt=m.mt,t=performance.now()/1000;
  m.legs.forEach(([h,kn],i)=>{const p=mt+i*Math.PI;h.rotation.x=Math.sin(p)*.7;kn.rotation.x=Math.max(0,Math.sin(p+1.5))*.9});
  m.arms.forEach(([sh,el,s],i)=>{sh.rotation.x=-Math.sin(mt+i*Math.PI)*.3-(m.chase?1.2:0);sh.rotation.z=s*(.08+Math.sin(t*3+i)*.04);el.rotation.x=-(m.chase?.5:.1)+Math.sin(t*9+i)*.05});
  const curl=m.chase?.9:.35+Math.sin(t*4)*.1;m.fingers.forEach(f=>f.forEach((j,n)=>j.rotation.x=curl*(.5+n*.35)));
  m.head.rotation.x=.45;m.head.rotation.z=Math.sin(t*2)*.12+(Math.random()<.04?(Math.random()-.5)*.6:0);
  m.jaw.rotation.x=.25+Math.sin(t*3)*.08+(m.chase?.35+Math.sin(t*14)*.1:0);
  m.body.position.y=Math.abs(Math.sin(mt))*.05;
}
const animMonster=dt=>animCreature(mon,dt);

// shapeshifters
const mimics=new Map();
function syncMimics(list){
  const seen=new Set();
  for(const[id,x,z,h,copy,rev]of list){seen.add(id);let q=mimics.get(id);
    if(!q){q={human:null,tc:null,copy:-1,rev:0};mimics.set(id,q)}
    const c=copy||1;
    if(q.copy!==c){if(q.human)scene.remove(q.human.g);q.human=makeHuman(c);q.human.g.position.set(x,0,z);scene.add(q.human.g);q.copy=c}
    if(!q.tc){q.tc=makeMonster({tone:0xa9b8a0,scale:.9,eye:0xffb000});q.tc.root.position.set(x,0,z);q.tc.init=true;scene.add(q.tc.root)}
    if(rev&&!q.rev&&Math.hypot(x-camera.position.x,z-camera.position.z)<16){burst(.4);toast('A shapeshifter!')}
    q.rev=rev;q.tx=x;q.tz=z;q.h=h;q.human.g.visible=!rev;q.tc.root.visible=!!rev;q.tc.tx=x;q.tc.tz=z;q.tc.h=h;q.tc.chase=rev?1:0}
  for(const[id,q]of mimics)if(!seen.has(id)){scene.remove(q.human.g,q.tc.root);mimics.delete(id)}
}

// security badge (held in front of the camera)
const badge=new THREE.Group();camera.add(badge);
(function(){const c=document.createElement('canvas');c.width=256;c.height=360;const x=c.getContext('2d');
  x.fillStyle='#e8e4d0';x.fillRect(0,0,256,360);x.fillStyle='#1b3a6b';x.fillRect(0,0,256,70);x.fillStyle='#fff';x.font='bold 30px Arial';x.textAlign='center';x.fillText('SECURITY',128,46);
  x.fillStyle='#b8b09a';x.fillRect(78,95,100,120);x.fillStyle='#8a8272';x.beginPath();x.arc(128,135,24,0,7);x.fill();x.fillRect(98,165,60,50);
  x.fillStyle='#222';x.font='20px monospace';x.fillText('LEVEL 0',128,250);x.fillText('AUTHORIZED',128,280);x.fillStyle='#c9a227';x.fillRect(0,330,256,30);
  const t=new THREE.CanvasTexture(c);
  part(new THREE.PlaneGeometry(.1,.14),new THREE.MeshStandardMaterial({map:t,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.3}),badge,0,0,.003);
  part(new THREE.BoxGeometry(.104,.144,.004),new THREE.MeshStandardMaterial({color:0xddd8c0}),badge);
  part(new THREE.BoxGeometry(.008,.4,.002),new THREE.MeshStandardMaterial({color:0x111111}),badge,0,.27,0)})();
let badgeHeld=false,badgeCharge=100,mouseR=false;
const BP={idle:new THREE.Vector3(.2,-.34,-.5),up:new THREE.Vector3(0,-.01,-.34)};

// ---------- network ----------
function connect(){
  const host=location.host||'localhost:3000';ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+host);
  ws.onopen=()=>{$('st').textContent='';send({t:'list'})};
  ws.onclose=()=>{$('st').textContent=location.host?'Disconnected — refresh the page.':'Cannot reach server. Run "npm start" and open http://localhost:3000'};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='rooms')showRooms(m.rooms);else if(m.t==='err')$('st').textContent=m.msg;
    else if(m.t==='w'){inRoom=true;$('lobby').style.display='none';$('pause').style.display='block';myId=m.id;N=m.N;CELL=m.CELL;grid=m.grid;build();m.items.forEach(addItem);inv[0]='G';drawInv();ready=true}
    else if(m.t==='s'){mon.tx=m.m[0];mon.tz=m.m[1];mon.h=m.m[2];mon.chase=m.m[3];if(!mon.init){mon.init=true;mon.root.visible=true;mon.root.position.set(m.m[0],0,m.m[1])}
      const seen=new Set();m.p.forEach(([id,x,z,ry,fl])=>{if(id===myId)return;seen.add(id);let o=others.get(id);if(!o){o=makePlayer(id);o.g.position.set(x,0,z);others.set(id,o)}o.tx=x;o.tz=z;o.ry=ry;o.beam.visible=!!fl});
      for(const[id,o]of others)if(!seen.has(id)){scene.remove(o.g);others.delete(id)}
      syncMimics(m.x||[]);$('info').textContent='Survivors: '+(m.p.length)}
    else if(m.t==='item')addItem(m.it);
    else if(m.t==='rm'){const it=items.get(m.id);if(it){scene.remove(it.mesh);items.delete(m.id)}}
    else if(m.t==='got'){const i=inv.indexOf(null);if(i>=0){inv[i]=m.type;toast('Picked up '+DEF[m.type].n)}drawInv()}
    else if(m.t==='caught')caught();
  };
}
function makePlayer(id){const h=makeHuman(id);scene.add(h.g);return h}
function addItem(it){
  const c={W:0x66ccff,B:0x55ff66,F:0x555555,L:0xff3322}[it.type];
  const geo=it.type==='W'?new THREE.BoxGeometry(.18,.4,.18):new THREE.CylinderGeometry(.1,.1,it.type==='F'?.5:.3,10);
  const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.6}));
  mesh.position.set(it.cx*CELL,.9,it.cy*CELL);if(it.type==='F')mesh.rotation.z=1.2;scene.add(mesh);items.set(it.id,{...it,mesh});
}

// ---------- inventory ----------
const has=t=>inv.includes(t);
function drawInv(){
  $('hot').innerHTML=inv.map((t,i)=>`<div class="slot${i===sel?' sel':''}"><b>${i+1}</b>${t?DEF[t].i:''}</div>`).join('');
  $('panel').innerHTML='<h3>INVENTORY</h3>'+(inv.some(Boolean)?inv.map((t,i)=>t?`<div>${i+1}. ${DEF[t].i} <b>${DEF[t].n}</b> — ${DEF[t].d}</div>`:'').join(''):'<i>Empty.</i>');
}
function toast(s){const t=$('toast');t.textContent=s;clearTimeout(toast.t);toast.t=setTimeout(()=>t.textContent='',2200)}
function useItem(i){
  sel=i;const t=inv[i];if(t){
    if(t==='W'){stamina=100;inv[i]=null;toast('Refreshing.')}
    else if(t==='B'){if(has('F')){battery=100;inv[i]=null;toast('Flashlight recharged')}else toast('You need a flashlight')}
    else if(t==='F')toggleFlash();
    else if(t==='L'){throwFlare();inv[i]=null}
    else if(t==='G')toast('Hold RIGHT MOUSE or Q to raise the badge')
  }drawInv();
}
function toggleFlash(){if(!has('F'))return toast('You have no flashlight');if(battery<=0)return toast('Battery dead');flashOn=!flashOn}
const flares=[];
function throwFlare(){
  const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));let x=camera.position.x,z=camera.position.z;
  for(let d=0;d<9;d+=.5){const nx=x+f.x*.5,nz=z+f.z*.5;if(blocked(nx,nz))break;x=nx;z=nz}
  const l=new THREE.PointLight(0xff4422,1.6,14);l.position.set(x,.5,z);scene.add(l);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.3,8),new THREE.MeshBasicMaterial({color:0xff6644}));m.position.set(x,.15,z);scene.add(m);
  flares.push({l,m,t:12});ws.send(JSON.stringify({t:'flare',x,z}));toast('Flare thrown');
}
function caught(){
  inv.fill(null);inv[0]='G';flashOn=false;battery=100;stamina=100;camera.position.set(4,1.65,4);drawInv();
  const f=$('flash');f.style.transition='none';f.style.opacity=1;setTimeout(()=>{f.style.transition='opacity 1.5s';f.style.opacity=0},60);
  burst(.6);toast('IT GOT YOU. You wake up where you started...');
}

// ---------- audio ----------
let AC,fearG;
function audio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();
  const mk=(f,ty,g)=>{const o=AC.createOscillator(),v=AC.createGain();o.type=ty;o.frequency.value=f;v.gain.value=g;o.connect(v);v.connect(AC.destination);o.start();return v};
  mk(60,'sawtooth',.02);mk(120,'square',.006);mk(121.5,'sine',.012);fearG=mk(46,'sawtooth',0)}
function burst(d){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
  const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=.5;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start()}

// ---------- input ----------
let inRoom=false;
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function showRooms(rs){const box=$('rooms');box.textContent='';if(!rs.length)box.textContent='No open lobbies — create one.';
  rs.forEach(r=>{const d=document.createElement('div');d.append(r.name+' ('+r.n+'/'+r.max+')');const b=document.createElement('button');b.textContent='Join';b.onclick=()=>send({t:'join',id:r.id});d.append(b);box.append(d)})}
$('solo').onclick=()=>send({t:'create',solo:true});
$('mk').onclick=()=>send({t:'create',name:$('nm').value});
$('rf').onclick=()=>send({t:'list'});
$('lv').onclick=()=>{send({t:'leave'});location.reload()};
$('enter').onclick=()=>{audio();if(AC.state==='suspended')AC.resume();renderer.domElement.requestPointerLock()};
document.addEventListener('pointerlockchange',()=>{$('menu').style.display=document.pointerLockElement===renderer.domElement?'none':'flex'});
connect();
addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.0022))});
addEventListener('keydown',e=>{keys[e.code]=true;if(!ready)return;
  if(e.code==='KeyE'){let b=null,bd=2.4;for(const it of items.values()){const d=Math.hypot(it.cx*CELL-camera.position.x,it.cy*CELL-camera.position.z);if(d<bd){bd=d;b=it}}
    if(b){if(inv.includes(null))ws.send(JSON.stringify({t:'pickup',id:b.id}));else toast('Inventory full')}}
  if(e.code==='KeyF'){toggleFlash()}
  if(e.code==='KeyI'||e.code==='Tab'){e.preventDefault();const p=$('panel');p.style.display=p.style.display==='block'?'none':'block'}
  if(/^Digit[1-6]$/.test(e.code))useItem(+e.code[5]-1)});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousedown',e=>{if(e.button===2)mouseR=true});addEventListener('mouseup',e=>{if(e.button===2)mouseR=false});addEventListener('contextmenu',e=>e.preventDefault());

// ---------- loop ----------
const clock=new THREE.Clock();
function update(dt){
  const locked=document.pointerLockElement===renderer.domElement;
  let f=locked?(keys.KeyW?1:0)-(keys.KeyS?1:0):0,s=locked?(keys.KeyD?1:0)-(keys.KeyA?1:0):0;
  const moving=f||s,sprint=moving&&keys.ShiftLeft&&stamina>0;
  stamina=Math.max(0,Math.min(100,stamina+(sprint?-22:12)*dt));
  if(moving){const l=Math.hypot(f,s),sp=(sprint?6.2:3.4)*dt/l;
    const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp,p=camera.position;
    if(canAt(p.x+dx,p.z))p.x+=dx;if(canAt(p.x,p.z+dz))p.z+=dz;bobT+=dt*(sprint?13:8)}
  camera.position.y=1.65+(moving?Math.sin(bobT)*.045:0);camera.rotation.set(pitch,yaw,0);
  if(flashOn){battery-=1.6*dt;if(battery<=0){battery=0;flashOn=false;toast('Flashlight died')}}
  spot.intensity+=((flashOn?(battery<15&&Math.random()<.3?0.3:2.4):0)-spot.intensity)*Math.min(1,dt*20);
  // monster + fear
  const wantB=locked&&(keys.KeyQ||mouseR);
  badgeHeld=wantB&&badgeCharge>(badgeHeld?0:20);badgeCharge=Math.max(0,Math.min(100,badgeCharge+(badgeHeld?-24:12)*dt));
  const bt=badgeHeld?BP.up:BP.idle;badge.position.lerp(bt,Math.min(1,dt*12));badge.rotation.x+=((badgeHeld?0:.5)-badge.rotation.x)*Math.min(1,dt*12);badge.rotation.y+=((badgeHeld?0:-.4)-badge.rotation.y)*Math.min(1,dt*12);
  animMonster(dt);
  const md=mon.init?Math.hypot(mon.root.position.x-camera.position.x,mon.root.position.z-camera.position.z):99;
  fear=Math.max(0,1-md/16);$('vig').style.opacity=fear*.8*(mon.chase?1:.5);
  if(fearG)fearG.gain.value=fear*fear*.12;
  flick-=dt;if(flick<=0){flick=Math.random()*(md<12?.15:2.5);const dim=Math.random()<(md<12?.6:.15)?.25+Math.random()*.3:1;amb.intensity=.4*dim;lamp.intensity=.8*dim;panelMat.color.setScalar(dim)}
  // others
  for(const o of others.values())stepHuman(o,dt,o.tx,o.tz,o.ry);
  for(const q of mimics.values()){stepHuman(q.human,dt,q.tx,q.tz,q.h+Math.PI);animCreature(q.tc,dt)}
  // items
  const t=performance.now()/1000;let near=null,nd=2.4;
  for(const it of items.values()){it.mesh.rotation.y+=dt;it.mesh.position.y=.9+Math.sin(t*2+it.id)*.08;
    const d=Math.hypot(it.cx*CELL-camera.position.x,it.cy*CELL-camera.position.z);if(d<nd){nd=d;near=it}}
  $('prompt').textContent=near?`[E] Pick up ${DEF[near.type].n}`:'';
  for(let i=flares.length-1;i>=0;i--){const fl=flares[i];fl.t-=dt;fl.l.intensity=fl.t<2?fl.t*.8:1.6+Math.random()*.4;if(fl.t<=0){scene.remove(fl.l,fl.m);flares.splice(i,1)}}
  $('bs').style.width=stamina+'%';$('bb').style.width=battery+'%';$('bg').style.width=badgeCharge+'%';
  if(performance.now()-lastSend>66&&ws&&ws.readyState===1){lastSend=performance.now();ws.send(JSON.stringify({t:'pos',x:camera.position.x,z:camera.position.z,ry:yaw,fl:flashOn?1:0,b:badgeHeld?1:0}))}
}
(function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());if(ready)update(dt);renderer.render(scene,camera)})();
</script></body></html>
